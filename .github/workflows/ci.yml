name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install ruff
      - run: ruff check .

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - run: pip install -e ".[spark,dev]"
      - name: pytest (includes Spark + Delta parity tests)
        shell: bash
        run: set -o pipefail; pytest -q -rfE --tb=short 2>&1 | tee pytest.log
      - name: Surface pytest output as an annotation on failure
        if: failure()
        shell: bash
        run: |
          [ -f pytest.log ] || exit 0
          python - <<'PY'
          lines = open("pytest.log", errors="replace").read().splitlines()
          keep = [l for l in lines if l.startswith(("FAILED", "ERROR", "E ", "ImportError", "ModuleNotFoundError"))]
          body = "\n".join((keep or lines)[-60:])
          print("::error title=pytest::" + body.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY

  dbt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dbt]"
      - name: Build synthetic silver lake
        run: python -m ledger.fixtures --out "$GITHUB_WORKSPACE/lake_fixture"
      - name: dbt build (models + tests) against the fixture lake
        working-directory: dbt
        env:
          LAKE_ROOT: ${{ github.workspace }}/lake_fixture
          DUCKDB_PATH: ${{ github.workspace }}/ci.duckdb
        run: dbt build --profiles-dir .

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
      - working-directory: infra/azure
        run: |
          terraform fmt -check
          terraform init -backend=false
          terraform validate
