version: 2

models:
  - name: dim_customers
    description: Type 2 customer dimension (one row per live customer version).
    tests:
      - no_overlapping_windows: { key: customer_id }
    columns:
      - name: customer_sk
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: valid_from
        tests: [not_null]
      - name: valid_to
        tests: [not_null]

  - name: fct_orders
    description: Current orders (deleted orders excluded) with point-in-time customer key.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_sk
        tests:
          - not_null
          - relationships: { to: ref('dim_customers'), field: customer_sk }
      - name: order_date
        tests: [not_null]
      - name: status
        tests:
          - not_null
          - accepted_values: { values: [placed, confirmed, delivered, cancelled] }
      - name: amount
        tests: [not_null, non_negative]

  - name: fct_daily_revenue
    description: Daily order counts and revenue, restated when amounts are corrected.
    columns:
      - name: order_date
        tests: [unique, not_null]
      - name: orders
        tests: [not_null]
      - name: gross_revenue
        tests: [not_null, non_negative]
      - name: delivered_revenue
        tests: [not_null, non_negative]
